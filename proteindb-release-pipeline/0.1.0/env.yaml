channels:
  - conda-forge
dependencies:
  - python=3.13
  - duckdb=1.5.4
  - pyarrow=24.0.0
  - adbc-driver-postgresql=1.11.0
  # git is a build-time need: the pip section below installs mgnolia from its
  # git source (it is not published to conda or PyPI).
  - git
  - pip
  - pip:
    # 64-bit row-index build (u64 IdxSize). The default conda-forge polars is
    # u32-indexed and errors on frames >2^32 rows; the per-protein release
    # artifacts exceed that. Same import name, pip-only — not on conda-forge.
    # Pinned to 1.33.1: the u64 build lags mainline polars and has no 1.41.x.
    - polars-u64-idx==1.33.1
    - mgnolia @ git+https://github.com/EBI-Metagenomics/mgnolia.git@6f70749
