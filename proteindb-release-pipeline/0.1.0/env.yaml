channels:
  - conda-forge
dependencies:
  - python=3.13
  - duckdb=1.5.4
  - pyarrow=24.0.0
  - adbc-driver-postgresql=1.11.0
  # git is a build-time need: the pip section below installs mgnolia from its
  # git source (it is not published to conda or PyPI).
  - git
  - pip
  - pip:
    # 64-bit row indexes. polars >=1.34 is a thin frontend that loads a runtime
    # backend; the default `polars-runtime-32` errors on frames >2^32 rows, which
    # the per-protein release artifacts exceed. mgnolia pulls plain polars, so we
    # request the rt64 extra to install `polars-runtime-64` — the frontend then
    # uses 64-bit indexes. (The legacy `polars-u64-idx` package is shadowed by the
    # 1.44 frontend and does NOT take effect; use the rt64 runtime, not that.)
    - polars[rt64]==1.44.1
    - mgnolia @ git+https://github.com/EBI-Metagenomics/mgnolia.git@6f70749
